name: Bug
description: A skill did the wrong thing in a real session.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report Pi package and fork compatibility problems here. Excluded buckets are manual-only; see [fork scope](https://github.com/mrpbaum/picock/blob/main/SCOPE.md). Redact credentials and personal information from session excerpts.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill, e.g. `to-tickets`, `grilling`.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: Pi version, package version or commit, and installation method (Pi package or manually linked skills).
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and effort
      description: e.g. Opus, high effort. Roughly how full was the context when it happened?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what the skill did. Paste the relevant part of the session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the skill should have done instead, and which line of the SKILL.md (if any) says so.
    validations:
      required: true
